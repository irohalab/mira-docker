user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
        worker_connections 4096;
        use epoll;
        multi_accept on;
}

http {
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
                ssl_prefer_server_ciphers on;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        gzip on;
        gzip_disable "msie6";

        # Define the Docker DNS resolver ONCE for the whole server
        resolver 127.0.0.11 valid=30s;

        # Pick the Angular SPA root based on the "mira_ui_version" cookie.
        # Empty/missing cookie or any unknown value falls back to the default app.
        map $cookie_mira_ui_version $spa_root {
                default   /home/wwwroot/mira;
                "next"    /home/wwwroot/mira-next;
        }

        # Strip the /pic or /video prefix so the remaining path is the
        # path-style S3 URI (i.e. /<bucket>/<key>).
        #   /pic/public-image/foo.jpg    -> /public-image/foo.jpg
        #   /video/public-video/foo.mp4  -> /public-video/foo.mp4
        map $uri $s3_uri {
                default                              "";
                "~^/pic(?<rest>/public-image/.+)$"   $rest;
                "~^/video(?<rest>/public-video/.+)$" $rest;
        }

        server {
                listen 80;
                listen [::]:80;

                server_name mira;
                root $spa_root;

                client_max_body_size 1G;
                index  index.html ;

                location /rt-log/ {
                        set $video_manager http://video-manager-api:8083;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header Host $host;
                        proxy_pass $video_manager;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "upgrade";
                }

                location ^~ /api/ {
                        proxy_pass http://albireo-server:5000/api/;
                        proxy_redirect off;
                        proxy_set_header   Host                 $host;
                        proxy_set_header   X-Real-IP            $remote_addr;
                        proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
                        proxy_set_header   X-Forwarded-Proto    $scheme;
                }
                location / {
                        try_files $uri $uri/ /index.html;
                }

                # Switch UI version (cookie-based, same URL, no subdomain/params)
                location = /ui/use-next {
                        add_header Set-Cookie "mira_ui_version=next; Path=/; Max-Age=31536000; SameSite=Lax";
                        return 302 /;
                }
                location = /ui/use-default {
                        add_header Set-Cookie "mira_ui_version=; Path=/; Max-Age=0; SameSite=Lax";
                        return 302 /;
                }
        }

        server {
                listen 80;
                listen [::]:80;

                server_name mira-static;
                root /home/wwwroot/albireo;
                expires 30d;

                # --- S3 backed public objects -------------------------------
                # These prefixes are longer than "/pic/" and "/video/", so nginx
                # selects them first and the static handlers below are untouched.
                #
                # $s3_backend must be the SeaweedFS S3 gateway's *service name*
                # (or container_name / network alias) in its own compose project.
                # The nginx container joins that project's external network, so
                # no host port needs to be published. Resolution happens at
                # request time via the Docker DNS resolver declared above, which
                # also means nginx still starts if SeaweedFS is down.
                location ^~ /pic/public-image/ {
                        set $s3_backend http://s3:8333;
                        proxy_pass $s3_backend$s3_uri$is_args$args;
                        proxy_http_version 1.1;
                        proxy_set_header Host          $proxy_host;
                        proxy_set_header Authorization "";
                        proxy_set_header X-Real-IP     $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                }

                location ^~ /video/public-video/ {
                        set $s3_backend http://s3:8333;
                        proxy_pass $s3_backend$s3_uri$is_args$args;
                        proxy_http_version 1.1;
                        proxy_set_header Host          $proxy_host;
                        proxy_set_header Authorization "";
                        proxy_set_header X-Real-IP     $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        # stream media instead of buffering whole objects
                        proxy_buffering off;
                        proxy_request_buffering off;
                }

                # --- local static files (/pic/<uuid>/..., /video/<uuid>/...) --
                location ^~ /pic/ {
                        if ($arg_size ~* "^\d+x\d+$") {
                                rewrite /pic/(.+) /resize_pic/$arg_size/$1 last;
                        }
                        rewrite ^/pic/(.+) /$1 break;
                }
                location ^~ /resize_pic/ {
                        proxy_pass http://picfit:3000/display/resize/;
                }

                location ^~ /video/ {
                        rewrite ^/video/(.+) /$1 break;
                }
        }
}